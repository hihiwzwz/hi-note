# Managed by scripts/deploy.mjs. Certificates retain the existing renewal setup.
server {
    listen 80;
    server_name hiwz.net www.hiwz.net;
    return 301 https://www.hiwz.net$request_uri;
}

server {
    listen 443 ssl;
    server_name hiwz.net;
    ssl_certificate /root/ssl/hiwz.net/fullchain.pem;
    ssl_certificate_key /root/ssl/hiwz.net/key.pem;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    return 301 https://www.hiwz.net$request_uri;
}

server {
    listen 443 ssl;
    server_name www.hiwz.net;
    root /etc/www/hiwz/current;
    index index.html;
    ssl_certificate /root/ssl/hiwz.net/fullchain.pem;
    ssl_certificate_key /root/ssl/hiwz.net/key.pem;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    add_header Cache-Control "no-cache" always;
    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /about.html { return 301 /posts/java-basics/; }
    location = /article.html { return 301 /posts/spring-basics/; }
    location = /tutirial.html { return 301 /posts/spring-mvc-annotations/; }
    location = /archive.html { return 301 /posts/mybatis-basics/; }
    location ~ (^|/)\. { return 404; }

    # Retain hashed assets across releases for pages already open in browsers.
    location /_astro/ {
        root /etc/www/hiwz/shared;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / { try_files $uri $uri/ =404; }
}
